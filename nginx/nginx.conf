# nginx/nginx.conf
# ─────────────────────────────────────────────────────────────
# Main Nginx Configuration
# Tuned for production: worker processes, connections, timeouts
# ─────────────────────────────────────────────────────────────

user  nginx;

# One worker per CPU core
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;                   # Most efficient on Linux
    multi_accept on;             # Accept as many connections as possible at once
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format  json  '{'
                      '"time":"$time_iso8601",'
                      '"remote_addr":"$remote_addr",'
                      '"method":"$request_method",'
                      '"uri":"$request_uri",'
                      '"status":$status,'
                      '"bytes":$body_bytes_sent,'
                      '"duration":$request_time,'
                      '"user_agent":"$http_user_agent"'
                      '}';

    access_log  /var/log/nginx/access.log  json;

    # ── Performance ───────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;          # Send headers in one packet
    tcp_nodelay     on;          # Don't buffer data
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ── Buffer sizes ──────────────────────────────────────────
    client_max_body_size     10M;
    client_body_buffer_size  128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers   1 32k;
    postpone_output  1460;

    # ── Timeouts ──────────────────────────────────────────────
    client_header_timeout  12s;
    client_body_timeout    12s;
    send_timeout           10s;

    # ── Security ──────────────────────────────────────────────
    server_tokens off;           # Don't expose Nginx version
    server_name_in_redirect off;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Include virtual host configs ──────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
