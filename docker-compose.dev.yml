version: '3.8'

# ─────────────────────────────────────────────────────────────
# Development Docker Compose
# - Hot reload via nodemon volume mount
# - Ports exposed for local access
# - No SSL (plain HTTP)
# - pgAdmin and Redis Commander included for debugging
# ─────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: .
      dockerfile: src/Dockerfile.dev
    container_name: backend_dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./app/src:/app/src:delegated       # Live code reload
      - ./app/database:/app/database:ro
      - /app/node_modules                   # Prevent host node_modules override
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://devuser:devpass@postgres:5432/devdb
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-not-for-production
      - JWT_REFRESH_SECRET=dev-refresh-secret-not-for-production
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev_network

  frontend:
    image: node:18-alpine
    container_name: frontend_dev
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    volumes:
      - ./app/frontend:/app:delegated
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - CHOKIDAR_USEPOLLING=true   # File watching in Docker
    networks:
      - dev_network

  postgres:
    image: postgres:15-alpine
    container_name: postgres_dev
    ports:
      - "5432:5432"               # Exposed for local tools (pgAdmin, DBeaver)
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./app/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_dev
    ports:
      - "6379:6379"               # Exposed for local debugging
    networks:
      - dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Dev tools ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_dev
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@local.com
      PGADMIN_DEFAULT_PASSWORD: devpass
    depends_on:
      - postgres
    networks:
      - dev_network
    profiles:
      - tools              # Only starts with: docker-compose --profile tools up

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_commander_dev
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - dev_network
    profiles:
      - tools

networks:
  dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
